<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGFXLAB — refined</title>
    <!-- Google Font & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #02090e;
        color: #ffffff;
      }

      /* ===== NAVBAR — professional, compact ===== */
      .navbar {
        width: 100%;
        height: 80px;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        padding: 0 4%;
        background: #02090e;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.3s ease;
      }

      .navbar.scrolled {
        height: 76px;
        background: rgba(2, 9, 14, 0.96);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* ===== BRAND — tighter ===== */
      .brand {
        display: flex;
        align-items: center;
        min-width: 240px;
        text-decoration: none;
      }

      .brand img {
        width: 190px;
        height: auto;
        object-fit: contain;
        display: block;
      }

      .brand-name {
        margin-left: 11px;
        font-size: 26px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -1px;
        color: #f0f4f7;
      }

      .brand-name span {
        color: #09c8ec;
      }

      /* ===== NAVIGATION — reduced font, balanced spacing ===== */
      .nav-menu {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 38px;
      }

      .nav-link {
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        color: #eef2f5;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.2px;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .nav-link:hover {
        color: #09c8ec;
      }

      /* Active underline – slimmer & closer to text */
      .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26px;
        height: 3px;
        border-radius: 20px;
        background: #09c8ec;
        transform: scaleX(0);
        transition: transform 0.25s ease;
      }

      .nav-link.active::after {
        transform: scaleX(1);
      }

      /* ===== JOIN BUTTON — compact, refined ===== */
      .community-btn {
        min-width: 190px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 18px;
        background: #09c8ec;
        color: #031017;
        text-decoration: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.2px;
        transition: all 0.25s ease;
      }

      .community-btn i {
        font-size: 20px;
      }

      .community-btn:hover {
        transform: translateY(-2px);
        background: #1ad9f2;
        box-shadow: 0 8px 25px rgba(11, 210, 237, 0.2);
      }

      /* ===== MOBILE TOGGLE ===== */
      .menu-toggle {
        display: none;
        width: 44px;
        height: 44px;
        border: none;
        background: transparent;
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .menu-toggle span {
        width: 22px;
        height: 2px;
        background: #ffffff;
        border-radius: 10px;
        transition: 0.3s;
      }

      /* ===== MOBILE MENU ===== */
      .mobile-menu {
        display: none;
      }

      /* ===== TABLET (≤1250px) ===== */
      @media (max-width: 1250px) {
        .navbar {
          padding: 0 3%;
        }

        .brand {
          min-width: 200px;
        }

        .brand img {
          width: 48px;
          height: 48px;
        }

        .brand-name {
          font-size: 23px;
          margin-left: 9px;
        }

        .nav-menu {
          gap: 22px;
        }

        .nav-link {
          font-size: 14px;
        }

        .nav-link::after {
          bottom: 22px;
          height: 3px;
        }

        .community-btn {
          min-width: 200px;
          height: 46px;
          font-size: 14px;
          padding: 0 18px;
        }

        .community-btn i {
          font-size: 18px;
        }
      }

      /* ===== MOBILE (≤1050px) ===== */
      @media (max-width: 1050px) {
        .navbar {
          height: 78px;
        }

        .navbar.scrolled {
          height: 70px;
        }

        .nav-menu,
        .community-btn {
          display: none;
        }

        .brand {
          min-width: auto;
        }

        .brand img {
          width: 46px;
          height: 46px;
        }

        .brand-name {
          font-size: 22px;
          letter-spacing: -0.8px;
          margin-left: 8px;
        }

        .menu-toggle {
          display: flex;
          margin-left: auto;
        }

        /* Mobile dropdown */
        .mobile-menu {
          position: fixed;
          top: 78px;
          left: 0;
          width: 100%;
          padding: 18px 6% 28px;
          background: #02090e;
          display: flex;
          flex-direction: column;
          gap: 2px;
          z-index: 999;
          transform: translateY(-120%);
          transition: transform 0.35s ease;
          border-bottom: 1px solid rgba(255, 255, 255, 0.07);
          box-shadow: 0 20px 30px -20px rgba(0, 0, 0, 0.6);
        }

        .mobile-menu.open {
          transform: translateY(0);
        }

        .mobile-menu a {
          color: #ffffff;
          text-decoration: none;
          padding: 14px 4px;
          font-size: 15px;
          font-weight: 500;
          letter-spacing: -0.2px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mobile-menu a:hover {
          color: #09c8ec;
        }

        .mobile-community-btn {
          margin-top: 14px;
          background: #09c8ec;
          color: #021017 !important;
          border-radius: 8px;
          text-align: center;
          font-weight: 700 !important;
          border: none !important;
          padding: 14px 5px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          font-size: 15px;
        }
      }

      /* ===== SMALL MOBILE (≤550px) ===== */
      @media (max-width: 550px) {
        .navbar {
          padding: 0 16px;
        }

        .brand img {
          width: 40px;
          height: 40px;
        }

        .brand-name {
          font-size: 19px;
          letter-spacing: -0.5px;
          margin-left: 7px;
        }

        .mobile-menu {
          top: 78px;
          padding: 16px 5% 26px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="navbar" id="navbar">
      <!-- LOGO + NAME -->
      <a href="#" class="brand">
        <img src="Photos/UGFXLABLogo.png" alt="UGFXLAB Logo" />
        <!-- <span class="brand-name">UGFX<span>LAB</span></span> -->
      </a>

      <!-- DESKTOP NAV -->
      <nav class="nav-menu">
        <a href="#home" class="nav-link active">Home</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#community" class="nav-link">Community</a>
        <a href="#mentorship" class="nav-link">Mentorship</a>
        <a href="#results" class="nav-link">Results</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <!-- JOIN BUTTON -->
      <a href="#community" class="community-btn">
        <i class="fa-brands fa-telegram"></i>
        <span>Join Free Community</span>
      </a>

      <!-- HAMBURGER -->
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- MOBILE NAV -->
    <div class="mobile-menu" id="mobileMenu">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#community">Community</a>
      <a href="#mentorship">Mentorship</a>
      <a href="#results">Results</a>
      <a href="#contact">Contact</a>
      <a href="#community" class="mobile-community-btn">
        <i class="fa-brands fa-telegram"></i>
        &nbsp; Join Free Community
      </a>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
      (function () {
        // Navbar scroll effect
        const navbar = document.getElementById("navbar");
        window.addEventListener("scroll", function () {
          if (window.scrollY > 30) {
            navbar.classList.add("scrolled");
          } else {
            navbar.classList.remove("scrolled");
          }
        });

        // Mobile menu toggle
        const menuToggle = document.getElementById("menuToggle");
        const mobileMenu = document.getElementById("mobileMenu");

        menuToggle.addEventListener("click", function (e) {
          e.stopPropagation();
          mobileMenu.classList.toggle("open");
        });

        // Close mobile menu when a link is clicked
        document.querySelectorAll(".mobile-menu a").forEach(function (link) {
          link.addEventListener("click", function () {
            mobileMenu.classList.remove("open");
          });
        });

        // Active link switching (desktop)
        const navLinks = document.querySelectorAll(".nav-link");
        navLinks.forEach(function (link) {
          link.addEventListener("click", function (e) {
            navLinks.forEach(function (item) {
              item.classList.remove("active");
            });
            this.classList.add("active");
          });
        });
      })();
    </script>
  </body>
</html>
